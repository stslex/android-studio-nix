name: build & update

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Pin to a specific version (e.g. 2026.1.2.10). Empty = latest stable."
        required: false
        default: ""

permissions:
  contents: write

# Serialize runs: a dispatch during cron, or a push mid-update, must not cancel
# an in-flight build or race two git pushes.
concurrency:
  group: android-studio-ci
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --- update-only steps: skipped on push ---
      - name: Bump sources.json
        if: github.event_name != 'push'
        run: ./scripts/update.sh "${{ github.event.inputs.version }}"

      - name: Detect sources change
        id: diff
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- pkgs/android-studio/sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh nixpkgs (wrapper/runtime deps)
        if: github.event_name != 'push' && steps.diff.outputs.changed == 'true'
        run: nix flake update nixpkgs

      # --- build gate ---
      # push  -> always (repo changed, prove it builds)
      # update -> only when the pin actually changed
      # success() is required: a custom `if:` replaces the default success() gate,
      # else the build would run after a failed flake update. Skipped steps are not failures.
      - name: Build
        if: success() && (github.event_name == 'push' || steps.diff.outputs.changed == 'true')
        run: nix build .#android-studio --print-build-logs

      # --- commit only in update-mode; never on push (would loop) ---
      - name: Commit and push
        if: success() && github.event_name != 'push' && steps.diff.outputs.changed == 'true'
        run: |
          version="$(jq -r .version pkgs/android-studio/sources.json)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkgs/android-studio/sources.json flake.lock
          git commit -m "android-studio: ${version}"
          git push
